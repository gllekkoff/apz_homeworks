hazelcast:
  cluster-name: dev
  network:
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - hz1:5701
          - hz2:5701
          - hz3:5701
  map:
    demo-map:
      backup-count: 1
    counter-map:
      backup-count: 0
      async-backup-count: 0
  queue:
    bounded-queue:
      max-size: 10
      backup-count: 1
